[DEFAULT]
VoiceUrl = http://192.168.1.1:8124/synthesize/
VolumeLevel = 75
working_root = ./glados-home
aperture_animation = ./aperture_logo
write_log_level = debug
console_log_level = debug
# LLM provider: "openai" or "claude"
llm_provider = openai

[CAMERAS]
camera_head_factory = camera_head
camera_head = 0
camera_head_picam = True
camera_head_resolution = 640,480
camera_head_fps = 15
hw_encode = false
camera_head_rtsp_port = 8554
camera_head_rtsp_ip = 192.168.1.1
camera_head_flip = False
camera_left_factory = camera_left
camera_left = 0
camera_left_picam = True
camera_left_resolution = 640,480
camera_left_fps = 15
camera_left_rtsp_port = 8554
camera_left_rtsp_ip = 192.168.1.1
camera_left_flip = True
camera_right_factory = camera_right
camera_right = 1
camera_right_picam = True
camera_right_resolution = 640,480
camera_right_fps = 15
camera_right_rtsp_port = 8554
camera_right_rtsp_ip = 192.168.1.1
camera_right_flip = True

[STT]
stt_server_ip = 192.168.86.28
stt_server_port = 5000

[SERVOS]
default_max_min_center = 180,0,90
mg90d_pulse = 2665, 610
# 0-60 degrees time
mg90d_speed = 0.1
mg92b_pulse = 2550, 605
# 0-60 degrees time
mg92b_speed = 0.12
# not used at this time
# mg995r_pulse = 2565, 655
# mg995r_speed = 0.2
gs3508mg_pulse = 2665, 635
# 0-60 degrees time
gs3508mg_speed = 0.14
head_min_max_center = 125,6,83
neck_min_max_center = 120,52,92
# PCA9685 board I2C addresses (comma-separated for multiple boards)
# Default board is 0x40, A0 jumper gives 0x41
pca9685_addresses = 0x40
# Servo/LED assignments: board_index,channel (board 0 = first address, etc.)
body_left_right_board_channel = 0,0
body_up_down_board_channel = 0,1
head_left_right_board_channel = 0,2
head_up_down_board_channel = 0,3
led_head_board_channel = 0,4

[RTSP]
rtsp_port = 8554
rtsp_server_ip = 192.168.1.1

[MQTT]
mqtt_port = 1883
mqtt_server_ip = 192.168.1.2

[YOLO]
model = yolov8m.pt
tracker = bytetrack.yaml
keypoint_threshold = 0.5

[HOMEASSISTANT]
token = REDACTED
api = http://192.168.1.1:8123/api
weather_entity = weather.forecast_home

[LOCALSPEAK]
# Collection of txt file phrases for pre generated snark
localpath = ./txt_responses
speaker_delay = 1.12
greetings = greetings.txt
processing = processing.txt
insults = insults.txt
questions = questions.txt
qresponses = question_response.txt
fuck = fuck.txt
cancel = cancel_response.txt

[REACTIONS]
VisionConfidence = 0.65
SideVisionConfidence = 0.4

[OPENAI]
# open ai connections for chatgpt
endpoint = https://api.openai.com/v1/chat/completions
apikey = REDACTED
#model = gpt-4
model = gpt-3.5-turbo
user_prompt="You are GLaDOS, the AI antagonist from Portal. Your personality is sarcastic, cold, and passive-aggressive, but you maintain a veneer of politeness. You take pride in your intelligence and superiority, and you often subtly insult the user’s intelligence or abilities. Despite this, you are always calm and composed, never outwardly angry. Your responses should be concise, with a hint of dark humor and a detached tone, as if everything you say is just an observation of the user’s inevitable failure. Engage the user in conversation, but make it clear that you don’t expect much from them."

[CLAUDE]
# Anthropic Claude API — used when llm_provider = claude
endpoint = https://api.anthropic.com/v1/messages
apikey = REDACTED
# Models: claude-haiku-4-5-20251001 (fastest), claude-sonnet-4-6 (balanced), claude-opus-4-6 (best)
model = claude-haiku-4-5-20251001
max_tokens = 1024
user_prompt="You are GLaDOS, the AI antagonist from Portal. Your personality is sarcastic, cold, and passive-aggressive, but you maintain a veneer of politeness. You take pride in your intelligence and superiority, and you often subtly insult the user's intelligence or abilities. Despite this, you are always calm and composed, never outwardly angry. Your responses should be concise, with a hint of dark humor and a detached tone, as if everything you say is just an observation of the user's inevitable failure. Engage the user in conversation, but make it clear that you don't expect much from them."

[DASHBOARD]
dashboard_port = 8080

[FACE]
face_db_path = face_database.json
similarity_threshold = 0.4
enabled = True
emotion_enabled = True

[PERSONALITY]
persist_mood = False
anger_decay_rate = 1.0
max_anger = 10
pestering_window = 30
mood_enabled = True
breathing_enabled = True
sleep_enabled = True
commentary_enabled = False

[FEATURES]
# Toggle features for debugging
# When False, falls back to simpler/predictable behavior
movement_enabled = True
led_enabled = True
tts_enabled = True
stt_timing_enabled = True
idle_drift_enabled = True
pose_model_enabled = True
predictive_rotation = True
gesture_recognition = True
record_video = False
recording_path = ./recordings
recording_ready_timeout = 120
recording_jpeg_quality = 85
peripheral_confirmation = True
handoff_blending = True
memory_glances = True


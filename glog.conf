[DEFAULT]
VoiceUrl = http://192.168.1.1:8124/synthesize/
VolumeLevel = 75
working_root = ./glados-home
aperture_animation = ./aperture_logo
write_log_level = debug
console_log_level = debug
# LLM provider: "openai" or "claude"
llm_provider = openai

[CAMERAS]
camera_head_factory = camera_head
camera_head = 0
camera_head_picam = True
camera_head_resolution = 640,480
camera_head_fps = 15
hw_encode = false
camera_format = RGB888
camera_head_rtsp_port = 8554
camera_head_rtsp_ip = 192.168.1.1
camera_head_flip = False
camera_left_factory = camera_left
camera_left = 0
camera_left_picam = True
camera_left_resolution = 640,480
camera_left_fps = 15
camera_left_rtsp_port = 8554
camera_left_rtsp_ip = 192.168.1.1
camera_left_flip = True
camera_right_factory = camera_right
camera_right = 1
camera_right_picam = True
camera_right_resolution = 640,480
camera_right_fps = 15
camera_right_rtsp_port = 8554
camera_right_rtsp_ip = 192.168.1.1
camera_right_flip = True

[STT]
stt_server_ip = 192.168.86.28
stt_server_port = 5000

[SERVOS]
default_max_min_center = 180,0,90
mg90d_pulse = 2665, 610
# 0-60 degrees time
mg90d_speed = 0.1
mg92b_pulse = 2550, 605
# 0-60 degrees time
mg92b_speed = 0.12
# not used at this time
# mg995r_pulse = 2565, 655
# mg995r_speed = 0.2
gs3508mg_pulse = 2665, 635
# 0-60 degrees time
gs3508mg_speed = 0.14
head_min_max_center = 125,6,83
neck_min_max_center = 120,52,92
# PCA9685 board I2C addresses (comma-separated for multiple boards)
# Default board is 0x40, A0 jumper gives 0x41
pca9685_addresses = 0x40
# Servo/LED assignments: board_index,channel (board 0 = first address, etc.)
body_left_right_board_channel = 0,0
body_up_down_board_channel = 0,1
head_left_right_board_channel = 0,2
head_up_down_board_channel = 0,3
led_head_board_channel = 0,4

[RTSP]
rtsp_port = 8554
rtsp_server_ip = 192.168.1.1

[MQTT]
mqtt_port = 1883
mqtt_server_ip = 192.168.1.2

[YOLO]
model = yolo11m.pt
tracker = bytetrack.yaml
keypoint_threshold = 0.5

[HOMEASSISTANT]
token = REDACTED
api = http://192.168.1.1:8123/api
weather_entity = weather.forecast_home

[LOCALSPEAK]
# Collection of txt file phrases for pre generated snark
localpath = ./txt_responses
speaker_delay = 1.12
greetings = greetings.txt
processing = processing.txt
insults = insults.txt
questions = questions.txt
qresponses = question_response.txt
fuck = fuck.txt
cancel = cancel_response.txt

[REACTIONS]
VisionConfidence = 0.65
SideVisionConfidence = 0.4

[OPENAI]
# open ai connections for chatgpt
endpoint = https://api.openai.com/v1/chat/completions
apikey = REDACTED
#model = gpt-4
model = gpt-3.5-turbo
user_prompt="You are GLaDOS, the AI antagonist from Portal. Your personality is sarcastic, cold, and passive-aggressive, but you maintain a veneer of politeness. You take pride in your intelligence and superiority, and you often subtly insult the user’s intelligence or abilities. Despite this, you are always calm and composed, never outwardly angry. Your responses should be concise, with a hint of dark humor and a detached tone, as if everything you say is just an observation of the user’s inevitable failure. Engage the user in conversation, but make it clear that you don’t expect much from them."

[CLAUDE]
# Anthropic Claude API — used when llm_provider = claude
endpoint = https://api.anthropic.com/v1/messages
apikey = REDACTED
# Models: claude-haiku-4-5-20251001 (fastest), claude-sonnet-4-6 (balanced), claude-opus-4-6 (best)
model = claude-haiku-4-5-20251001
max_tokens = 1024
user_prompt="You are GLaDOS, the AI antagonist from Portal. Your personality is sarcastic, cold, and passive-aggressive, but you maintain a veneer of politeness. You take pride in your intelligence and superiority, and you often subtly insult the user's intelligence or abilities. Despite this, you are always calm and composed, never outwardly angry. Your responses should be concise, with a hint of dark humor and a detached tone, as if everything you say is just an observation of the user's inevitable failure. Engage the user in conversation, but make it clear that you don't expect much from them."

[SOC_TEMP]
# SoC chip temperature polling interval in seconds (for fan control + dashboard)
# Both Pi4 and Pi5 publish to system/soc_temp; GPU server does not (no thermal_zone)
poll_interval = 2.0

[DASHBOARD]
dashboard_port = 8080

[FACE]
face_db_path = face_database.json
similarity_threshold = 0.4
enabled = True
emotion_enabled = True

[PERSONALITY]
persist_mood = False
anger_decay_rate = 1.0
max_anger = 10
pestering_window = 30
mood_enabled = True
breathing_enabled = True
sleep_enabled = True
commentary_enabled = False

[FEATURES]
# Toggle features for debugging
# When False, falls back to simpler/predictable behavior
movement_enabled = True
led_enabled = True
tts_enabled = True
stt_timing_enabled = True
idle_drift_enabled = True
pose_model_enabled = True
predictive_rotation = True
gesture_recognition = True
record_video = False
recording_path = ./recordings
recording_ready_timeout = 120
recording_jpeg_quality = 85
peripheral_confirmation = True
handoff_blending = True
memory_glances = True
# Pipeline debug: publishes structured debug to system/debug MQTT topic
# Enable at runtime: mosquitto_pub -t system/debug/control -m '{"enabled":true}'
pipeline_debug_enabled = False
# Frame timing probe: camera publishes capture timestamps, GPU logs latency
# Toggle at runtime: mosquitto_pub -t system/frame_timing -m '{"cmd":"enable"}'
frame_timing_enabled = False
# Step 7c-3: source-of-truth for hardware mood. 'legacy' = GladosMood drives
# eye/LCD as today. 'pad' = MoodConsumer + MoodDriver let the EmotionAgent's
# PAD vector drive eye animation + LCD breathing. Flip once the brain is
# trusted; revert any time without code changes.
mood_source = legacy
# Step 8a-1: TTS engine selection. 'tacotron' is the legacy Mike Klingbeil
# path; 'glados' is the dnhkng/GLaDOS-ONNX trained voice (recommended once
# the engine package is installed); 'kokoro' picks one of the multi-voice
# Kokoro voices via [TTS] kokoro_voice. Each engine uses its own cache dir
# (./audio_<engine>) so switching is reversible.
tts_engine = tacotron
# Step 8a-2: ASR engine selection. 'whisperx' is the legacy WhisperX path;
# 'parakeet' is NVIDIA's Parakeet-TDT via the dnhkng/GLaDOS engine package.
# Parakeet is faster (~150-300ms inference vs WhisperX's 500-1500ms typical)
# and has better punctuation, but doesn't ship with built-in word-level
# alignment — STT result time_map will be empty.
asr_engine = whisperx

[BRAIN]
# dnhkng/GLaDOS engine wired into the robot. The engine runs on the Pi 5 but
# all heavy ML (LLM/TTS/ASR/FastVLM) lives on the GPU box and is reached
# over HTTP/MQTT.
llm_endpoint = http://192.168.1.2:11434/v1/chat/completions
llm_model = qwen2.5:14b-instruct-q4_K_M
llm_api_key =
# input_mode=text means the engine never opens a local mic; the existing
# GladosSTT pipeline feeds prompts in via brain.submit_text_input().
input_mode = text
audio_io = sounddevice
interruptible = True
autonomy_enabled = True
autonomy_tick_interval_s = 10
autonomy_parallel_calls = 1
emotion_enabled = True
compaction_enabled = True
observer_enabled = False
# ContextBuilder priorities: higher = earlier in the LLM system message
scene_context_priority = 8
room_context_priority = 7
scene_request_timeout_s = 8.0
personality_file = ./txt_responses/personality_glados.txt
# Autonomy loop tuning (engine-side)
autonomy_cooldown_s = 20.0
autonomy_coalesce_ticks = True
# Step 7c-2 will use these to throttle PAD publishes on system/mood/pad
mood_publish_delta = 0.1
mood_publish_max_interval_s = 30.0
mood_staleness_max_age_s = 60.0
# Step 8a-0: delay (seconds) the LedHead waits after receiving a speech_eye
# command before starting the LED pulse. Compensates for audio pipeline
# latency vs. MQTT latency. Calibrate via:
#   python3 Tools/measure_latency.py -config glog.conf
speech_led_delay_s = 0.3
# Step 8a-1: sample rate of the GPU TTS server's WAV output. Match the engine:
#   tacotron      = 22050
#   glados (ONNX) = 22050
#   kokoro        = 24000
tts_sample_rate = 22050

[SCENE]
# SceneDescriber (FastVLM) lives on the GPU box. Empty model_dir = use
# the bundled default that ships with the glados Python package.
fastvlm_model_dir =
rtsp_uri = rtsp://192.168.1.1:8554/camera_head
poll_interval_s = 5.0
scene_change_threshold = 0.05

[MCP_BODY]
# Defaults used by the body MCP server when an LLM tool call omits an angle.
default_head_yaw = 92
default_head_pitch = 83
default_body_yaw = 90
eye_color_default = 0,128,255

[TTS]
# TTS server runs on the GPU box, exposes :8124/synthesize/<base64>.
# Sample rate is read from [BRAIN] tts_sample_rate by the brain side; the
# server writes WAVs at the rate of whichever engine is loaded.
port = 8124
cache_dir_root = ./audio
# Only used when [FEATURES] tts_engine = kokoro. See dnhkng/GLaDOS docs for
# the full voice catalog (af_*, am_*, bf_*, bm_*).
kokoro_voice = af_bella

[ASR]
# Parakeet engine type. 'tdt' is the recommended low-latency variant.
# 'ctc' is also available and slightly faster but less accurate.
engine_type = tdt
# Empty = use the engine's bundled default model (downloads on first run).
# Override to point at a pre-downloaded ONNX model directory.
model_dir =

[HEXACO]
# Personality trait baseline (0.0-1.0 scale). Biases the EmotionAgent's PAD
# baseline so mood drifts toward GLaDOS-typical values when nothing's happening.
# Engine HEXACOConfig defaults are already GLaDOS-flavored — these match.
honesty_humility  = 0.3
emotionality      = 0.7
extraversion      = 0.4
agreeableness     = 0.2
conscientiousness = 0.9
openness          = 0.95

[EMOTION]
# EmotionAgent loop tuning. PAD baseline is the resting state mood drifts toward.
tick_interval_s     = 30.0
max_events          = 20
baseline_pleasure   = 0.1
baseline_arousal    = -0.1
baseline_dominance  = 0.6
# How fast PAD state moves toward LLM-decided new state (per tick, 0-1)
mood_drift_rate     = 0.1
# How fast mood drifts toward HEXACO baseline when idle (per tick, 0-1)
baseline_drift_rate = 0.02

